<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- outer glow -->
  <circle cx="13" cy="13" r="12" fill="url(#g)" opacity="0.18"/>
  <!-- glass fill -->
  <circle cx="13" cy="13" r="9.5" fill="url(#g)" fill-opacity="0.14"/>
  <!-- lens ring -->
  <circle cx="13" cy="13" r="9.5" stroke="url(#g)" stroke-width="2.4"/>
  <!-- specular highlight -->
  <circle cx="9.5" cy="9.5" r="1.8" fill="white" fill-opacity="0.22"/>
  <!-- handle -->
  <line x1="20.2" y1="20.2" x2="28.4" y2="28.4" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round"/>
</svg>
