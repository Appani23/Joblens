server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/joblens?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: joblens123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  # Base64-encoded HS256 secret — change this in production
  secret: am9ibGVucy1qd3Qtc2VjcmV0LWtleS1mb3ItdXNlci1zZXJ2aWNlLW11c3QtYmUtbG9uZy1lbm91Z2g=
  expiration-ms: 86400000  # 24 hours

app:
  mail:
    from-name: ${MAIL_FROM_NAME:JobLens}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
