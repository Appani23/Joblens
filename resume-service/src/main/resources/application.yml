server:
  port: 8082

spring:
  application:
    name: resume-service
  datasource:
    url: jdbc:mysql://localhost:3306/joblens?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: joblens123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Must match user-service jwt.secret exactly
jwt:
  secret: am9ibGVucy1qd3Qtc2VjcmV0LWtleS1mb3ItdXNlci1zZXJ2aWNlLW11c3QtYmUtbG9uZy1lbm91Z2g=

storage:
  local:
    dir: ./resume-uploads

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-6
  base-url: https://api.anthropic.com

# spring-dotenv: walk up one level so the root .env is found when Maven runs
# from the module directory. ignore-if-missing keeps CI/CD happy when vars
# arrive via real environment variables instead of a file.
dotenv:
  directory: ../
  ignore-if-missing: true

resilience4j:
  circuitbreaker:
    instances:
      anthropic:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      anthropic:
        max-attempts: 2
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
