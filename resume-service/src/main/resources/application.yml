server:
  port: 8082

spring:
  application:
    name: resume-service
  datasource:
    url: jdbc:mysql://localhost:3306/joblens?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: joblens123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Must match user-service jwt.secret exactly — tokens are validated cross-service
jwt:
  secret: am9ibGVucy1qd3Qtc2VjcmV0LWtleS1mb3ItdXNlci1zZXJ2aWNlLW11c3QtYmUtbG9uZy1lbm91Z2g=

storage:
  local:
    dir: ./resume-uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
