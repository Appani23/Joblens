server:
  port: 8083

spring:
  application:
    name: job-aggregator-service
  datasource:
    url: jdbc:mysql://localhost:3306/joblens?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: joblens123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: job-aggregator
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: localhost
      port: 6379

joblens:
  fetch:
    interval-ms: 21600000      # 6 hours — override to a smaller value for local testing
    initial-delay-ms: 60000   # 1 minute startup delay
    queries:
      - what: "java developer"
        where: "albany"
      - what: "java developer"
        where: "new york"

# spring-dotenv: look one level up from the module directory so the root .env
# is found regardless of whether Maven is invoked from the repo root or the
# module folder. ignore-if-missing keeps CI/CD working when vars come from
# the environment directly rather than a file.
dotenv:
  directory: ../
  ignore-if-missing: true

adzuna:
  app-id: ${ADZUNA_APP_ID}
  app-key: ${ADZUNA_APP_KEY}
  base-url: https://api.adzuna.com/v1/api/jobs/us/search

resilience4j:
  circuitbreaker:
    instances:
      adzuna:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      adzuna:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
