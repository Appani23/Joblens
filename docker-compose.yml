version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: joblens-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: joblens123
      MYSQL_DATABASE: joblens
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - joblens-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: joblens-redis
    ports:
      - "6379:6379"
    networks:
      - joblens-network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: joblens-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - joblens-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: joblens-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - joblens-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  joblens-network:
    driver: bridge
